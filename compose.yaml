services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manager_library}
      POSTGRES_USER: ${POSTGRES_USER:-manager_library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy infra/.env.example to infra/.env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      APP_NAME: ManagerLibrary
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      PHP_CLI_SERVER_WORKERS: 4
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-manager_library}
      DB_USERNAME: ${POSTGRES_USER:-manager_library}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy infra/.env.example to infra/.env and set POSTGRES_PASSWORD}
      DB_SCHEMA_PATH: ${DB_SCHEMA_PATH:-library,public}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env (at least 32 characters)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in infra/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COVERS_DIR: /var/www/html/storage/app/private/covers
    volumes:
      - ../api:/var/www/html
      - api_vendor:/var/www/html/vendor
      - api_covers:/var/www/html/storage/app/private/covers
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) file_get_contents('http://127.0.0.1:8000/health'), '\"status\":\"ok\"') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - sh
      - -c
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
        exec php artisan serve --no-reload --host=0.0.0.0 --port=8000

  api-demo:
    profiles: ["tools"]
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      APP_NAME: ManagerLibrary
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-manager_library}
      DB_USERNAME: ${POSTGRES_USER:-manager_library}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy infra/.env.example to infra/.env and set POSTGRES_PASSWORD}
      DB_SCHEMA_PATH: ${DB_SCHEMA_PATH:-library,public}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env (at least 32 characters)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in infra/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COVERS_DIR: /var/www/html/storage/app/private/covers
      DEMO_LIBRARY_TIME: ${DEMO_LIBRARY_TIME:-2020-01-01T12:00:00Z}
    volumes:
      - ../api:/var/www/html
      - api_vendor:/var/www/html/vendor
      - api_covers:/var/www/html/storage/app/private/covers
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) file_get_contents('http://127.0.0.1:8001/health'), '\"status\":\"ok\"') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - sh
      - -c
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
        exec php artisan serve --no-reload --host=0.0.0.0 --port=8001

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
    volumes:
      - ../app:/app
      - app_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  page:
    build:
      context: ../page
      dockerfile: Dockerfile
    ports:
      - "${PAGE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tool:
    profiles: ["tools"]
    build:
      context: ../tool
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api-demo:8001/api/v1
      VERIFY_API_BASE_URL: http://api:8000/api/v1
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in infra/.env}
      DEMO_LIBRARY_TIME: ${DEMO_LIBRARY_TIME:-2020-01-01T12:00:00Z}
    depends_on:
      api-demo:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_vendor:
  api_covers:
  app_node_modules:
